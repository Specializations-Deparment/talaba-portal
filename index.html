<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طلبہ کارکردگی پورٹل</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
body{font-family:'Noto Nastaliq Urdu',serif;background:#f3f6f4;margin:0;color:#173;line-height:2}
.w{max-width:1000px;margin:auto;padding:12px}
.c{background:#fff;border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 4px #0002}
h1,h2,h3{color:#0b5d3b;margin:4px 0}
input,select,button{font:inherit;padding:4px 10px;margin:3px;border:1px solid #9bb;border-radius:8px}
button{background:#0b5d3b;color:#fff;border:0;cursor:pointer}
.t{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{border:1px solid #cdd;padding:2px 8px;text-align:center;white-space:nowrap}th{background:#e3f1ea}
.g{display:flex;flex-wrap:wrap;gap:4px;align-items:center}[hidden]{display:none!important}
.im{width:40px;height:40px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-left:6px}
#pimg{width:70px;height:70px}
</style>
</head>
<body><div class="w">
<h1>📚 طلبہ کارکردگی پورٹل</h1>

<div id="login" class="c">
  <h2>لاگ اِن</h2>
  <input id="u" placeholder="یوزر نیم"><input id="p" type="password" placeholder="پاس ورڈ">
  <button onclick="login()">داخل ہوں</button> <b id="msg" style="color:#c00"></b>
</div>

<div id="app" hidden>
  <div class="c"><b id="who"></b> <button onclick="location.reload()">لاگ آؤٹ</button></div>
  <div id="mine" class="c" hidden></div>

  <div class="c"><h2>نئی کارکردگی درج کریں</h2>
    <div class="g"><select id="st" onchange="fields()"></select><input id="dt" type="month" title="ماہ"></div>
    <div id="flds" class="g"></div>
    <div class="g"><input id="no" placeholder="نوٹ"><button onclick="add()">محفوظ کریں</button></div>
    <div id="ph" class="g">تصویر:
      <img id="pimg" class="im" alt="" hidden><input type="file" accept="image/*" onchange="pick(this)">
    </div>
  </div>

  <div id="tg" class="c" hidden><h2>ماہانہ ہدف مقرر کریں</h2><div class="g">
    <select id="tc" onchange="loadT()"></select><input id="tm" type="month" onchange="loadT()">
    <input id="t_mutalia" type="number" placeholder="مطالعہ ہدف (صفحات)">
    <input id="t_hazri" type="number" placeholder="حاضری ہدف (دن)">
    <input id="t_madaniPhool" type="number" placeholder="مدنی پھول ہدف">
    <button onclick="setT()">ہدف محفوظ کریں</button>
  </div></div>

  <div id="adm" class="c" hidden><h2>نیا یوزر شامل کریں (منتظم)</h2><div class="g">
    <input id="nn" placeholder="نام"><input id="nu" placeholder="یوزر نیم"><input id="np" placeholder="پاس ورڈ">
    <select id="nr"><option value="student">طالب علم</option><option value="teacher">استاد</option></select>
    <input id="nc" placeholder="جماعت"><button onclick="addUser()">شامل کریں</button>
  </div></div>

  <div class="c"><h2>تجزیہ</h2>
    ماہ: <select id="mf" onchange="render()"></select>
    جماعت: <select id="cf" onchange="render()"></select>
    <div id="out"></div>
  </div>

  <div class="c"><h2>حالیہ اندراجات</h2><div class="t"><table id="log"></table></div></div>
</div>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbyMaERKLv2aE6K3ZHlW2QG-VGOQAdF-Nu4vXF7az-TEo3KRxOWwmUD7l-3FricEbPgV9g/exec';
let U,P,D,CH=[];
const TK=['mutalia','hazri','madaniPhool'];
const COL=['#0b5d3b','#3b6fb6','#2e8b57','#c9a227','#a0522d','#7b4fa3','#d2691e','#008b8b'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const L=k=>D.labels[D.keys.indexOf(k)];
const cfg=c=>(D.classes.find(x=>x.class==c)||{f:{deeni12:0,mutalia:0,madaniPhool:0,hazri:0}}).f;
const mon=e=>String(e.date).slice(0,7);
const fk=f=>D.keys.filter(k=>k!='photo'&&k in f);
const V=e=>{const o={};['mutalia','test','madaniPhool','fatwe'].forEach(k=>{if(e[k]!==''&&e[k]!=null)o[k]=+e[k]});
  try{Object.assign(o,JSON.parse(e.data||'{}'))}catch(_){}return o;};
const tgt=(cl,key,ms)=>ms.reduce((a,m)=>{const r=D.targets.find(x=>x.class==cl&&String(x.month).slice(0,7)==m);return a+(r?+r[key]||0:0)},0);
async function call(o){
  let r;
  try{r=await(await fetch(API,{method:'POST',body:JSON.stringify({u:U,p:P,...o})})).json();}
  catch(e){return {ok:false,msg:'سرور سے جواب نہیں ملا۔ Apps Script میں نیا Code.gs لگا کر setup چلایا اور New version Deploy کیا ہے؟'};}
  if(r.ok&&!r.keys)return {ok:false,msg:'Code.gs کا نیا ورژن Deploy نہیں ہوا'};
  return r;
}

async function login(){
  U=$('u').value.trim();P=$('p').value;$('msg').textContent='...';
  try{const r=await call({action:'list'});
    if(!r.ok)return $('msg').textContent=r.msg;
    D=r;$('login').hidden=true;$('app').hidden=false;
    $('who').textContent=D.me.name+' — '+{admin:'منتظم',teacher:'استاد',student:'طالب علم'}[D.me.role];
    $('adm').hidden=D.me.role!='admin';$('tg').hidden=D.me.role=='student';
    $('dt').value=$('tm').value=new Date().toISOString().slice(0,7);
    fill();
  }catch(e){$('msg').textContent='کنکشن میں مسئلہ'}
}
function fill(){
  const sv=$('st').value,cv=$('cf').value,mv=$('mf').value,tv=$('tc').value;
  $('st').innerHTML=D.students.map(s=>`<option value="${esc(s.username)}">${esc(s.name)} (${esc(s.class)})</option>`).join('');
  if(sv)$('st').value=sv;
  const cl=[...new Set(D.students.map(s=>s.class))];
  $('cf').innerHTML='<option value="">تمام جماعتیں</option>'+cl.map(c=>`<option>${esc(c)}</option>`).join('');
  $('cf').value=cv;
  $('tc').innerHTML=cl.map(c=>`<option>${esc(c)}</option>`).join('');if(tv)$('tc').value=tv;
  const ms=[...new Set(D.entries.map(mon))].sort().reverse();
  $('mf').innerHTML='<option value="">تمام مہینے</option>'+ms.map(m=>`<option>${m}</option>`).join('');
  $('mf').value=ms.includes(mv)?mv:(ms[0]||'');
  if(D.me.role=='student'&&D.students[0]){const s=D.students[0],im=D.photos[s.username];
    $('mine').hidden=false;
    $('mine').innerHTML=(im?`<img class="im" style="width:110px;height:110px" src="${im}">`:'<small>ابھی تصویر نہیں لگی، نیچے سے لگائیں</small>')+` <b>${esc(s.name)}</b> — ${esc(s.class)}`;}
  fields();loadT();render();
}
function fields(){
  const s=D.students.find(x=>x.username==$('st').value);
  if(!s){$('flds').innerHTML='';return;}
  $('flds').innerHTML=fk(cfg(s.class)).map(k=>`<input id="f_${k}" type="number" step="any" placeholder="${esc(L(k))}">`).join('');
  const im=D.photos[s.username];$('pimg').hidden=!im;if(im)$('pimg').src=im;
}
function loadT(){
  const r=D.targets.find(x=>x.class==$('tc').value&&String(x.month).slice(0,7)==$('tm').value)||{};
  TK.forEach(k=>$('t_'+k).value=r[k]||'');
}
async function setT(){
  const r=await call({action:'setTarget',cls:$('tc').value,month:$('tm').value,
    mutalia:$('t_mutalia').value,hazri:$('t_hazri').value,madaniPhool:$('t_madaniPhool').value});
  if(!r.ok)return alert(r.msg);D=r;fill();alert('ہدف محفوظ ہو گیا ✅');
}
async function add(){
  const vals={};D.keys.forEach(k=>{const el=$('f_'+k);if(el&&el.value!=='')vals[k]=+el.value;});
  const r=await call({action:'add',student:$('st').value,date:$('dt').value,vals,note:$('no').value});
  if(!r.ok)return alert(r.msg);
  D=r;$('no').value='';fill();alert('محفوظ ہو گیا ✅');
}
function pick(inp){
  const f=inp.files[0];if(!f)return;const im=new Image();
  im.onload=async()=>{const r=Math.min(1,160/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const x=await call({action:'photo',student:$('st').value,img:c.toDataURL('image/jpeg',.6)});
    if(!x.ok)return alert(x.msg);D=x;fill();alert('تصویر محفوظ ہو گئی ✅');};
  im.onerror=()=>alert('یہ تصویر کھل نہیں
