<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Performance Portal</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
@font-face{font-family:'JNN';src:local('Jameel Noori Nastaleeq'),local('JameelNooriNastaleeq'),local('Jameel Noori Nastaleeq Kasheeda'),url('JameelNooriNastaleeq.ttf') format('truetype');font-display:swap}
:root{--ink:#14201f;--mute:#5d6e6b;--line:#d9e1df;--paper:#f2f5f4;--card:#fff;--pri:#0e3b3a;--pri2:#1b5c58;--tint:#e4eeec;--ok:#1f8a63;--mid:#c98a1b;--low:#b5453a;--serif:'Fraunces','Noto Naskh Arabic',serif;--sans:'Source Sans 3','Noto Naskh Arabic',sans-serif}
html[lang=ur]{--serif:'JNN','Noto Nastaliq Urdu','Noto Naskh Arabic',serif;--sans:'JNN','Noto Nastaliq Urdu','Noto Naskh Arabic',serif}
html[lang=ur] h1,html[lang=ur] h2,html[lang=ur] h3,html[lang=ur] h4,html[lang=ur] .ttl,html[lang=ur] .me b{font-weight:400}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);font-variant-numeric:tabular-nums}
html[lang=ur] body{line-height:2.05}
h1,h2,h3,.ttl{font-family:var(--serif);font-weight:700;line-height:1.3;margin:0}
html[lang=ur] h1,html[lang=ur] h2,html[lang=ur] h3,html[lang=ur] .ttl{line-height:2.1}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7fb8ae;outline-offset:2px}
[hidden]{display:none!important}
td,option,.nm,.me b{unicode-bidi:plaintext}
.top{background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:12px;background:#fff;color:var(--pri);display:grid;place-items:center;font:700 18px var(--serif);overflow:hidden}
.mark img{width:100%;height:100%;object-fit:contain;padding:4px}
.brand small{opacity:.75;display:block;line-height:1.3}
.ttl{font-size:21px}
.tr{display:flex;align-items:center;gap:10px;font-size:15px}
.user{display:flex;align-items:center;gap:10px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:8px 18px;cursor:pointer;font-weight:600;display:inline-block}
.btn:hover{background:var(--pri2)}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid currentColor}
.btn.sm{padding:5px 14px;font-size:14px}
.top .btn,.lang{background:rgba(255,255,255,.14);color:#fff}
.lang{border:0;border-radius:10px;padding:6px 14px;cursor:pointer;font-weight:600}
.lang:hover{background:rgba(255,255,255,.25)}
.wrap{max-width:1120px;margin:0 auto;padding:16px}
.login{max-width:820px;margin:48px auto;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.login .side{background:var(--pri);color:#fff;padding:36px 30px;display:flex;flex-direction:column;justify-content:center}
.lg{width:150px;height:150px;object-fit:contain;background:#fff;border-radius:24px;padding:10px;margin-bottom:18px;align-self:flex-start}
.login .side h1{font-size:28px}.login .side p{opacity:.8;margin:10px 0 0}
.login form{padding:36px 30px;display:flex;flex-direction:column;gap:12px}
.err{color:var(--low);min-height:1.5em;font-weight:600}
label.f{display:flex;flex-direction:column;font-size:14px;color:var(--mute);gap:3px;font-weight:600}
label.f input,label.f select,.bar-tools select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:16px;color:var(--ink);width:100%;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:8px 0 18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 18px;cursor:pointer;color:var(--mute);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--pri);border-color:var(--pri)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.panel>h2{font-size:21px;color:var(--pri);margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-top:12px}
.bar-tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px;padding:12px 14px;background:var(--paper);border-radius:12px}
.bar-tools label{display:flex;align-items:center;gap:8px;color:var(--mute);font-weight:600}
.bar-tools select{width:auto;min-width:150px}
.bar-tools .sp{flex:1}
.me{display:flex;align-items:center;gap:16px;background:var(--tint);border-radius:14px;padding:14px 18px;margin-bottom:16px}
.me b{font:700 21px var(--serif)}
.ava{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.ava.xl{width:84px;height:84px;font-size:34px}
.ini{display:inline-grid;place-items:center;background:var(--tint);color:var(--pri);font-weight:700;border:1px solid var(--line)}
.nm{display:flex;align-items:center;gap:10px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:26px}
.kpi{border:1px solid var(--line);border-top:4px solid var(--pri);border-radius:12px;padding:12px 16px;background:#fff}
.kpi.ok{border-top-color:var(--ok)}.kpi.mid{border-top-color:var(--mid)}.kpi.low{border-top-color:var(--low)}
.kpi small{display:block;color:var(--mute);font-weight:600;font-size:13px;letter-spacing:.02em}
.kpi b{display:block;font:700 30px/1.25 var(--serif)}
.cls{margin-bottom:34px}
.clsh{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-inline-start:5px solid var(--pri);padding-inline-start:12px;margin-bottom:12px}
.clsh h3{font-size:20px;color:var(--pri);unicode-bidi:plaintext}
.chip{background:var(--tint);color:var(--pri);border-radius:20px;padding:0 12px;font-size:14px;font-weight:600}
.t{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:600px}
th{background:var(--tint);color:var(--pri);font-size:13px;padding:9px 8px;text-align:center;position:sticky;top:0;white-space:nowrap;letter-spacing:.02em}
td{padding:9px 8px;border-top:1px solid var(--line);text-align:center;vertical-align:middle}
td:first-child,th:first-child,td.l,th.l{text-align:start}
tbody tr:hover td{background:#f1f7f6}
small.tg{display:block;font-weight:400;color:var(--mute)}
.rk{color:var(--mute);font-weight:700;width:36px}
.cell{display:flex;align-items:baseline;justify-content:center;gap:5px}
.num{font-weight:700;font-size:17px}
.of{color:var(--mute);font-size:13px}
.pc{font-size:13px;font-weight:700}
.pc.ok{color:var(--ok)}.pc.mid{color:#a46f10}.pc.low{color:var(--low)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:5px auto 0;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;border-radius:3px}
.bar i.ok{background:var(--ok)}.bar i.mid{background:var(--mid)}.bar i.low{background:var(--low)}
.ov{display:flex;flex-direction:column;align-items:center;gap:1px}
.ov b{font-size:17px}
.bd{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:0 10px;white-space:nowrap}
.bd.ok{background:#e1f3ea;color:var(--ok)}.bd.mid{background:#fbf0d9;color:#8a5d0c}.bd.low{background:#f8e1de;color:var(--low)}
.cbox{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-top:14px}
.c2{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:92px}
.c2 .bar{width:100%;margin:3px 0}
td.l .nm{white-space:nowrap;min-width:130px}
.sc .bar{width:100%;margin:6px 0 2px}
.scs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.sc{border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:#fff;display:flex;flex-direction:column;gap:2px}
.sc small{color:var(--mute);font-weight:600;font-size:13px}
.sc b{font:700 26px/1.3 var(--serif)}
.sc .of{font:400 14px var(--sans)}
.sc.big{background:var(--pri);border-color:var(--pri);color:#fff}
.sc.big small{color:#ffffffbb}.sc.big b{font-size:34px}
.sc.big .bd{align-self:flex-start}
.sc.ok{border-top:4px solid var(--ok)}.sc.mid{border-top:4px solid var(--mid)}.sc.low{border-top:4px solid var(--low)}
.sc.big.ok,.sc.big.mid,.sc.big.low{border-top-width:1px}
.scf{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
@media print{.top,.tabs,.bar-tools,.vr,#toast,.md,.ib,.hint{display:none!important}body{background:#fff}.panel{border:0;padding:0}.cls{break-inside:avoid}}
.cbox h5{margin:0 0 8px;font:700 15px var(--sans);color:var(--mute);letter-spacing:.02em}
.hint{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:14px;background:#fbf6ea;border:1px solid #ecdcb4;color:#6b4e0e;border-radius:12px;padding:10px 16px}
.note{color:var(--mute);font-size:14px;margin:6px 0 0}
.empty{text-align:center;color:var(--mute);padding:36px 10px}
h4{font:700 18px var(--serif);color:var(--pri);margin:28px 0 8px}
.md{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:8;padding:12px}
.mb{background:#fff;border-radius:14px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.nm.click{cursor:pointer}.nm.click:hover .nmt{text-decoration:underline;color:var(--pri)}
.ava.xxl{width:110px;height:110px;font-size:44px}
.pmb{max-width:880px;position:relative}
.pmh{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.pmh h2{color:var(--pri);unicode-bidi:plaintext}
.pmx{position:absolute;top:8px;inset-inline-end:12px;font-size:22px;color:var(--mute)}
.pz{cursor:zoom-in;display:inline-block}
#lb{z-index:10;background:#000c;cursor:zoom-out}
#lb figure{margin:0;text-align:center;color:#fff}
#lb img{max-width:90vw;max-height:78vh;border-radius:14px;border:6px solid #fff;background:#fff;object-fit:contain}
#lb figcaption{margin-top:10px;font-weight:600;unicode-bidi:plaintext}
.btn.danger{background:var(--low)}
.cal{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff;margin-bottom:18px}
.cal .hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.cal h3{font-size:19px;color:var(--pri)}
.cleg{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.cgrid .w{text-align:center;color:var(--mute);font-size:12px;font-weight:700}
.cgrid .d{min-height:42px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;background:#fafcfb;color:var(--mute)}
.cgrid .d.e{border:0;background:transparent}
.cgrid .d.p{background:var(--ok);border-color:var(--ok);color:#fff}.cgrid .d.l{background:var(--mid);border-color:var(--mid);color:#fff}.cgrid .d.a{background:var(--low);border-color:var(--low);color:#fff}
.pps{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-size:15px;font-weight:600}
.atbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:12px}
.dstep{display:flex;gap:6px;align-items:center}.dstep input{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:16px}
.atk{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 4px}
.at-t{border:1px solid var(--line);border-top:4px solid var(--pri);border-radius:12px;padding:8px 14px;background:#fff}
.at-t small{display:block;color:var(--mute);font-weight:600;font-size:13px}.at-t b{font:700 26px/1.25 var(--serif)}
.at-t.ok{border-top-color:var(--ok)}.at-t.mid{border-top-color:var(--mid)}.at-t.low{border-top-color:var(--low)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:7px 20px;font-weight:600;color:var(--mute);cursor:pointer;border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}.seg button:hover{background:var(--tint)}
.seg button.on.p{background:var(--ok);color:#fff}.seg button.on.l{background:var(--mid);color:#fff}.seg button.on.a{background:var(--low);color:#fff}
tr.st-p td:first-child{border-inline-start:4px solid var(--ok)}tr.st-l td:first-child{border-inline-start:4px solid var(--mid)}tr.st-a td:first-child{border-inline-start:4px solid var(--low)}
.stick{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;margin-top:14px}
.attcard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:18px;background:#fff}
.attcard .hd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.attcard h3{font-size:19px;color:var(--pri)}
.nmchip{display:inline-flex;align-items:center;border-radius:20px;padding:0 14px;font-weight:600;cursor:pointer;unicode-bidi:plaintext}
.nmchip.a{background:#f8e1de;color:var(--low)}.nmchip.l{background:#fbf0d9;color:#8a5d0c}
.at3{display:inline-flex;gap:6px;flex-wrap:wrap}
.ab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:2px 16px;cursor:pointer;font-weight:600;color:var(--mute)}
.ab.p.on{background:var(--ok);border-color:var(--ok);color:#fff}.ab.l.on{background:var(--mid);border-color:var(--mid);color:#fff}.ab.a.on{background:var(--low);border-color:var(--low);color:#fff}
.attc{display:flex;gap:6px;flex-wrap:wrap}
.f input.bad{border-color:var(--low);background:#fdf3f2}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{background:none;border:0;cursor:pointer;font-size:17px;padding:0 4px}
.ckg{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.ck{display:flex;align-items:center;gap:6px;background:var(--tint);color:var(--pri);border-radius:20px;padding:2px 14px;cursor:pointer;font-weight:600}
.ck input{width:auto;margin:0}
.plist{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:10px;margin-top:8px}
.pr{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 14px;background:#fff}
.pr.off{background:var(--paper);opacity:.6}
.pr .lb{flex:1;display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.pr .lb input{width:18px;height:18px;margin:0;accent-color:var(--pri)}
.pr input.tin{width:120px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.vtag{font-size:12px;opacity:.75;border:1px solid #ffffff55;border-radius:20px;padding:0 10px;white-space:nowrap}
.vr{text-align:center;color:var(--mute);font-size:12px;padding:18px 10px 26px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 22px;border-radius:12px;z-index:9;font-weight:600}
#toast.bad{background:var(--low)}
@media(max-width:700px){.login{grid-template-columns:1fr;margin:16px}.top{padding:8px 12px}.panel{padding:14px}.ttl{font-size:17px}.bar-tools .sp{display:none}}
@media(prefers-reduced-motion:no-preference){.tabs button,.lang{transition:color .15s,background .15s}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark"><img src="logo.png" alt="" onerror="this.replaceWith('SD')"></span><div><div class="ttl" data-i="title"></div><small data-i="sub"></small></div></div>
  <div class="tr">
    <span class="vtag" id="vtag"></span>
    <button class="lang" id="lgb" onclick="setLang(LG=='en'?'ur':'en')"></button>
    <div id="user" class="user" hidden><span id="who"></span><button class="btn" onclick="location.reload()" data-i="logout"></button></div>
  </div>
</header>

<div id="login" class="login">
  <div class="side"><img class="lg" src="logo.png" alt="Jamia-tul-Madina" onerror="this.style.display='none'"><h1 data-i="side_h"></h1><p data-i="side_p"></p></div>
  <form onsubmit="login();return false">
    <h2 data-i="signin"></h2>
    <label class="f"><span data-i="user_l"></span><input id="u" autocomplete="username"></label>
    <label class="f"><span data-i="pass_l"></span><input id="p" type="password" autocomplete="current-password"></label>
    <div id="msg" class="err"></div>
    <button class="btn" type="submit" data-i="signin"></button>
  </form>
</div>

<div id="app" class="wrap" hidden>
  <nav class="tabs">
    <button data-t="an" class="on" onclick="show('an')" data-i="t_an"></button>
    <button data-t="en" onclick="show('en')" data-i="t_en"></button>
    <button data-t="at" id="tbA" onclick="show('at')" data-i="t_at"></button>
    <button data-t="tg" id="tbT" onclick="show('tg')" data-i="t_tg"></button>
    <button data-t="adm" id="tbU" onclick="show('adm')" data-i="t_us"></button>
  </nav>

  <section id="p_an" class="panel">
    <div id="mine" class="me" hidden></div>
    <div class="bar-tools">
      <label><span data-i="month"></span><select id="mf" onchange="render()"></select></label>
      <label><span data-i="cls"></span><select id="cf" onchange="fsf();render()"></select></label>
      <label><span data-i="stu"></span><select id="sf" onchange="render()"></select></label>
      <label><span data-i="sr_l"></span><select id="sr" onchange="srOpen(this)"></select></label>
      <span class="sp"></span>
      <button class="btn ghost sm" onclick="window.print()" data-i="print"></button>
      <button class="btn ghost sm" onclick="exportCSV()" data-i="export"></button>
    </div>
    <div id="attcard"></div>
    <div id="mycal"></div>
    <div id="out"></div>
    <h4 data-i="recent"></h4>
    <div class="t"><table id="log"></table></div>
  </section>

  <section id="p_en" class="panel" hidden>
    <h2 data-i="e_h"></h2>
    <div class="grid" style="margin-top:12px">
      <label class="f"><span data-i="stu"></span><select id="st" onchange="fields()"></select></label>
      <label class="f"><span data-i="month"></span><input id="dt" type="month" onchange="fields()"></label>
    </div>
    <div id="flds" class="grid" style="margin-top:12px"></div>
    <div id="svto" class="note" style="margin-top:10px"></div>
    <div id="autoat" class="note" style="margin-top:6px"></div>
    <div id="lockmsg" class="hint" hidden></div>
    <div class="row">
      <label class="f" style="flex:1;min-width:200px"><span data-i="note"></span><input id="no"></label>
      <button class="btn" id="savebtn" onclick="add()" data-i="save"></button>
      <span id="fillcnt" class="note" style="align-self:center"></span>
    </div>
    <div id="ph" class="row" style="border-top:1px solid var(--line);margin-top:20px;padding-top:16px;align-items:center">
      <span id="pv"></span>
      <label class="btn ghost"><span data-i="add_photo"></span><input type="file" accept="image/*" hidden onchange="pick(this)"></label>
    </div>
  </section>

  <section id="p_at" class="panel" hidden>
    <h2 data-i="at_h"></h2>
    <p class="note" data-i="at_note"></p>
    <div class="atbar">
      <label class="f"><span data-i="cls"></span><select id="ac" onchange="loadAtt()"></select></label>
      <label class="f"><span data-i="at_date"></span><div class="dstep" dir="ltr"><button class="btn ghost sm" onclick="stepDay(-1)">‹</button><input id="ad" type="date" onchange="loadAtt()"><button class="btn ghost sm" onclick="stepDay(1)">›</button><button class="btn ghost sm" onclick="goToday()" data-i="at_today"></button></div></label>
      <label class="f"><span data-i="at_search"></span><input id="aq" oninput="drawAtt()" autocomplete="off" style="border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:16px;font-weight:400"></label>
    </div>
    <div id="atk" class="atk"></div>
