<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طلبہ کارکردگی پورٹل</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--ink:#14201f;--mute:#5d6e6b;--line:#d9e1df;--paper:#f2f5f4;--card:#fff;--pri:#0e3b3a;--pri2:#1b5c58;--tint:#e4eeec;--ok:#1f8a63;--mid:#c98a1b;--low:#b5453a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.9 'Noto Naskh Arabic',serif}
h1,h2,h3,.ttl{font-family:'Noto Nastaliq Urdu',serif;font-weight:700;line-height:2.2;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7fb8ae;outline-offset:2px}
[hidden]{display:none!important}
.top{background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 20px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:12px;background:#fff;color:var(--pri);display:grid;place-items:center;font:700 26px 'Noto Nastaliq Urdu',serif}
.brand small{opacity:.75;display:block;line-height:1.4}
.ttl{font-size:21px}
.user{display:flex;align-items:center;gap:10px;font-size:15px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:7px 18px;cursor:pointer;font-weight:600;display:inline-block}
.btn:hover{background:var(--pri2)}
.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor}
.top .btn{background:rgba(255,255,255,.14)}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
/* login */
.login{max-width:820px;margin:48px auto;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.login .side{background:var(--pri);color:#fff;padding:36px 30px;display:flex;flex-direction:column;justify-content:center}
.lg{width:132px;height:132px;object-fit:contain;background:#fff;border-radius:50%;padding:12px;margin-bottom:14px;align-self:flex-start}
.login .side h1{font-size:26px}.login .side p{opacity:.8;margin:8px 0 0}
.login form{padding:36px 30px;display:flex;flex-direction:column;gap:12px}
.err{color:var(--low);min-height:1.9em;font-weight:600}
/* fields */
label.f{display:flex;flex-direction:column;font-size:14px;color:var(--mute);gap:2px}
label.f input,label.f select,.bar-tools select,.in{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:16px;color:var(--ink);width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:8px 0 18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:8px 18px;cursor:pointer;color:var(--mute);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--pri);border-color:var(--pri)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel>h2{font-size:20px;color:var(--pri);margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-top:12px}
.bar-tools{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.bar-tools label{display:flex;align-items:center;gap:8px;color:var(--mute)}
.bar-tools select{width:auto;min-width:150px}
/* profile banner */
.me{display:flex;align-items:center;gap:16px;background:var(--tint);border-radius:14px;padding:14px 18px;margin-bottom:16px}
.me b{font:700 20px 'Noto Nastaliq Urdu',serif}
.ava{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.ava.xl{width:84px;height:84px;font-size:34px}
.ini{display:inline-grid;place-items:center;background:var(--tint);color:var(--pri);font-weight:700;border:1px solid var(--line)}
.nm{display:flex;align-items:center;gap:10px;font-weight:600}
/* class block */
.cls{margin-bottom:30px}
.clsh{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-right:5px solid var(--pri);padding-right:12px;margin-bottom:10px}
.clsh h3{font-size:19px;color:var(--pri)}
.chip{background:var(--tint);color:var(--pri);border-radius:20px;padding:0 12px;font-size:14px;font-weight:600}
.t{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px}
th{background:var(--tint);color:var(--pri);font-size:14px;padding:6px 12px;text-align:center;position:sticky;top:0;white-space:nowrap}
td{padding:8px 12px;border-top:1px solid var(--line);text-align:center;vertical-align:middle}
td:first-child,th:first-child{text-align:right}
tr:nth-child(even) td{background:#fafcfb}
small.tg{display:block;font-weight:400;color:var(--mute)}
.num{font-weight:700;font-size:17px}
.pc{font-size:13px;font-weight:700;margin-right:6px}
.pc.ok{color:var(--ok)}.pc.mid{color:var(--mid)}.pc.low{color:var(--low)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.bar i.ok{background:var(--ok)}.bar i.mid{background:var(--mid)}.bar i.low{background:var(--low)}
.cw{height:260px;margin-top:14px}
.note{color:var(--mute);font-size:14px;margin:6px 0 0}
.empty{text-align:center;color:var(--mute);padding:36px 10px}
h4{font:700 17px 'Noto Nastaliq Urdu',serif;color:var(--pri);margin:26px 0 8px}
.md{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:8;padding:12px}
.mb{background:#fff;border-radius:14px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.ib{background:none;border:0;cursor:pointer;font-size:17px;padding:0 4px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 22px;border-radius:12px;z-index:9;font-weight:600}
#toast.bad{background:var(--low)}
@media(max-width:700px){.login{grid-template-columns:1fr;margin:16px}.top{padding:6px 12px}.panel{padding:14px}.ttl{font-size:17px}}
@media(prefers-reduced-motion:no-preference){.tabs button{transition:color .15s}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">ط</span><div><div class="ttl">طلبہ کارکردگی پورٹل</div><small>شعبہ تخصصات</small></div></div>
  <div id="user" class="user" hidden><span id="who"></span><button class="btn" onclick="location.reload()">لاگ آؤٹ</button></div>
</header>

<div id="login" class="login">
  <div class="side"><img class="lg" src="logo.png" alt="جامعۃ المدینہ"><h1>ہر طالب علم کی ماہانہ کارکردگی</h1><p>مطالعہ، حاضری، مدنی پھول اور جماعت کے مطابق باقی کام، ایک ہی جگہ۔</p></div>
  <form onsubmit="login();return false">
    <h2>لاگ اِن</h2>
    <label class="f">یوزر نیم<input id="u" autocomplete="username"></label>
    <label class="f">پاس ورڈ<input id="p" type="password" autocomplete="current-password"></label>
    <div id="msg" class="err"></div>
    <button class="btn" type="submit">داخل ہوں</button>
  </form>
</div>

<div id="app" class="wrap" hidden>
  <nav class="tabs">
    <button data-t="an" class="on" onclick="show('an')">تجزیہ</button>
    <button data-t="en" onclick="show('en')">کارکردگی درج کریں</button>
    <button data-t="tg" id="tbT" onclick="show('tg')">ماہانہ ہدف</button>
    <button data-t="adm" id="tbU" onclick="show('adm')">یوزرز</button>
  </nav>

  <section id="p_an" class="panel">
    <div id="mine" class="me" hidden></div>
    <div class="bar-tools">
      <label>ماہ <select id="mf" onchange="render()"></select></label>
      <label>جماعت <select id="cf" onchange="fsf();render()"></select></label>
      <label>طالب علم <select id="sf" onchange="render()"></select></label>
    </div>
    <div id="out"></div>
    <h4>حالیہ اندراجات</h4>
    <div class="t"><table id="log"></table></div>
  </section>

  <section id="p_en" class="panel" hidden>
    <h2>نئی کارکردگی درج کریں</h2>
    <div class="grid" style="margin-top:12px">
      <label class="f">طالب علم<select id="st" onchange="fields()"></select></label>
      <label class="f">ماہ<input id="dt" type="month"></label>
    </div>
    <div id="flds" class="grid" style="margin-top:12px"></div>
    <div class="row">
      <label class="f" style="flex:1;min-width:200px">نوٹ<input id="no"></label>
      <button class="btn" onclick="add()">محفوظ کریں</button>
    </div>
    <div id="ph" class="row" style="border-top:1px solid var(--line);margin-top:20px;padding-top:16px;align-items:center">
      <span id="pv"></span>
      <label class="btn ghost" style="color:var(--pri)">تصویر لگائیں<input type="file" accept="image/*" hidden onchange="pick(this)"></label>
    </div>
  </section>

  <section id="tg" class="panel" hidden>
    <h2>ماہانہ ہدف مقرر کریں</h2>
    <p class="note">جماعت اور ماہ منتخب کریں۔ اسی ہدف کے مطابق فیصد نکلے گا۔</p>
    <div class="grid" style="margin-top:12px">
      <label class="f">جماعت<select id="tc" onchange="loadT()"></select></label>
      <label class="f">ماہ<input id="tm" type="month" onchange="loadT()"></label>
      <label class="f">مطالعہ (صفحات)<input id="t_mutalia" type="number"></label>
      <label class="f">حاضری (دن)<input id="t_hazri" type="number"></label>
      <label class="f">مدنی پھول<input id="t_madaniPhool" type="number"></label>
    </div>
    <div class="row"><button class="btn" onclick="setT()">ہدف محفوظ کریں</button></div>
  </section>

  <section id="adm" class="panel" hidden>
    <h2>نیا یوزر شامل کریں</h2>
    <div class="grid" style="margin-top:12px">
      <label class="f">نام<input id="nn"></label>
      <label class="f">یوزر نیم<input id="nu"></label>
      <label class="f">پاس ورڈ<input id="np"></label>
      <label class="f">کردار<select id="nr"><option value="student">طالب علم</option><option value="teacher">استاد</option></select></label>
      <label class="f">جماعت<input id="nc"></label>
    </div>
    <div class="row"><button class="btn" onclick="addUser()">یوزر شامل کریں</button></div>
    <h4>تمام یوزرز <span id="uc" class="chip"></span></h4>
    <div class="t"><table id="ul"></table></div>
  </section>
</div>
<div id="md" class="md" hidden><div class="mb">
  <h2 id="e_h" style="color:var(--pri)"></h2>
  <div class="grid" style="margin-top:10px"><label class="f">ماہ<input id="e_m" type="month"></label></div>
  <div id="e_f" class="grid" style="margin-top:12px"></div>
  <label class="f" style="margin-top:12px">نوٹ<input id="e_n"></label>
  <div class="row"><button class="btn" onclick="saveE()">تبدیلی محفوظ کریں</button><button class="btn ghost" style="color:var(--pri)" onclick="$('md').hidden=true">منسوخ کریں</button></div>
</div></div>
<div id="toast" hidden></div>

<script>
const API='https://script.google.com/macros/s/AKfycbyMaERKLv2aE6K3ZHlW2QG-VGOQAdF-Nu4vXF7az-TEo3KRxOWwmUD7l-3FricEbPgV9g/exec';
let U,P,D,CH=[],TT;
const TK=['mutalia','hazri','madaniPhool'];
const COL=['#0e3b3a','#2f6fa3','#1f8a63','#c98a1b','#8a4f7d','#b5453a','#5d6e6b','#3aa0a0'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const L=k=>D.labels[D.keys.indexOf(k)];
const cfg=c=>(D.classes.find(x=>x.class==c)||{f:{deeni12:0,mutalia:0,madaniPhool:0,hazri:0}}).f;
const mon=e=>String(e.date).slice(0,7);
const fk=f=>D.keys.filter(k=>k!='photo'&&k in f);
const V=e=>{const o={};['mutalia','test','madaniPhool','fatwe'].forEach(k=>{if(e[k]!==''&&e[k]!=null)o[k]=+e[k]});
  try{Object.assign(o,JSON.parse(e.data||'{}'))}catch(_){}return o;};
const tgt=(cl,key,ms)=>ms.reduce((a,m)=>{const r=D.targets.find(x=>x.class==cl&&String(x.month).slice(0,7)==m);return a+(r?+r[key]||0:0)},0);
const lv=p=>p>=75?'ok':p>=40?'mid':'low';
const ava=(u,n,c='')=>D.photos[u]?`<img class="ava ${c}" src="${D.photos[u]}" alt="">`:`<span class="ava ini ${c}">${esc(String(n).trim()[0]||'')}</span>`;
function toast(m,bad){const t=$('toast');t.textContent=m;t.className=bad?'bad':'';t.hidden=false;clearTimeout(TT);TT=setTimeout(()=>t.hidden=true,2800);}
function show(t){['an','en','tg','adm'].forEach(x=>{$(x=='an'||x=='en'?'p_'+x:x).hidden=x!=t;});
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));}
async function call(o){
  let r;
  try{r=await(await fetch(API,{method:'POST',body:JSON.stringify({u:U,p:P,...o})})).json();}
  catch(e){return {ok:false,msg:'سرور سے جواب نہیں ملا۔ Apps Script میں نیا Code.gs لگا کر setup چلایا اور New version Deploy کیا ہے؟'};}
  if(r.ok&&!r.keys)return {ok:false,msg:'Code.gs کا نیا ورژن Deploy نہیں ہوا'};
  return r;
}
async function login(){
  U=$('u').value.trim();P=$('p').value;$('msg').textContent='';
  const r=await call({action:'list'});
  if(!r.ok)return $('msg').textContent=r.msg;
  D=r;$('login').hidden=true;$('app').hidden=false;$('user').hidden=false;
  $('who').textContent=D.me.name+' — '+{admin:'منتظم',teacher:'استاد',student:'طالب علم'}[D.me.role];
  $('tbU').hidden=D.me.role!='admin';$('tbT').hidden=D.me.role=='student';
  $('dt').value=$('tm').value=new Date().toISOString().slice(0,7);
  fill();
}
function fill(){
  const sv=$('st').value,cv=$('cf').value,mv=$('mf').value,tv=$('tc').value;
  $('st').innerHTML=D.students.map(s=>`<option value="${esc(s.username)}">${esc(s.name)} (${esc(s.class)})</option>`).join('');
  if(sv)$('st').value=sv;
  const cl=[...new Set(D.students.map(s=>s.class))];
  $('cf').innerHTML='<option value="">تمام جماعتیں</option>'+cl.map(c=>`<option>${esc(c)}</option>`).join('');
  $('cf').value=cv;
  $('tc').innerHTML=cl.map(c=>`<option>${esc(c)}</option>`).join('');if(tv)$('tc').value=tv;
  const ms=[...new Set(D.entries.map(mon))].sort().reverse();
  $('mf').innerHTML='<option value="">تمام مہینے</option>'+ms.map(m=>`<option>${m}</option>`).join('');
  $('mf').value=ms.includes(mv)?mv:(ms[0]||'');
  fsf();ulist();fields();loadT();render();
}
function fsf(){
  const c=$('cf').value,v=$('sf').value,ss=D.students.filter(s=>!c||s.class==c);
  $('sf').innerHTML='<option value="">تمام طلبہ</option>'+ss.map(s=>`<option value="${esc(s.username)}">${esc(s.name)}</option>`).join('');
  if(ss.some(s=>s.username==v))$('sf').value=v;
  $('sf').parentElement.hidden=D.me.role=='student';
}
function ulist(){
  const R={admin:'منتظم',teacher:'استاد',student:'طالب علم'};
  if(!D.users){$('ul').innerHTML='<tr><td>یوزرز کی فہرست کے لیے نیا Code.gs لگا کر Deploy کریں</td></tr>';return;}
  $('uc').textContent='کل '+D.users.length;
  $('ul').innerHTML='<tr><th>نام</th><th>یوزر نیم</th><th>کردار</th><th>جماعت</th></tr>'+
    D.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${R[u.role]||esc(u.role)}</td><td>${esc(u.class)}</td></tr>`).join('');
}
function fields(){
  const s=D.students.find(x=>x.username==$('st').value);
  if(!s){$('flds').innerHTML='';$('pv').innerHTML='';return;}
  $('flds').innerHTML=fk(cfg(s.class)).map(k=>`<label class="f">${esc(L(k))}<input id="f_${k}" type="number" step="any"></label>`).join('');
  $('pv').innerHTML=ava(s.username,s.name,'xl');
}
function loadT(){
  const r=D.targets.find(x=>x.class==$('tc').value&&String(x.month).slice(0,7)==$('tm').value)||{};
  TK.forEach(k=>$('t_'+k).value=r[k]||'');
}
async function setT(){
  const r=await call({action:'setTarget',cls:$('tc').value,month:$('tm').value,
    mutalia:$('t_mutalia').value,hazri:$('t_hazri').value,madaniPhool:$('t_madaniPhool').value});
  if(!r.ok)return toast(r.msg,1);D=r;fill();toast('ہدف محفوظ ہو گیا');
}
async function add(){
  const vals={};D.keys.forEach(k=>{const el=$('f_'+k);if(el&&el.value!=='')vals[k]=+el.value;});
  const r=await call({action:'add',student:$('st').value,date:$('dt').value,vals,note:$('no').value});
  if(!r.ok)return toast(r.msg,1);
  D=r;$('no').value='';fill();toast('کارکردگی محفوظ ہو گئی');
}
function pick(inp){
  const f=inp.files[0];if(!f)return;const im=new Image();
  im.onload=async()=>{const r=Math.min(1,160/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const x=await call({action:'photo',student:$('st').value,img:c.toDataURL('image/jpeg',.6)});
    if(!x.ok)return toast(x.msg,1);D=x;fill();toast('تصویر محفوظ ہو گئی');};
  im.onerror=()=>toast('یہ تصویر کھل نہیں سکی، JPG یا PNG چنیں',1);
  im.src=URL.createObjectURL(f);inp.value='';
}
async function addUser(){
  const r=await call({action:'addUser',name:$('nn').value,nu:$('nu').value,np:$('np').value,role:$('nr').value,cls:$('nc').value});
  if(!r.ok)return toast(r.msg,1);
  D=r;fill();['nn','nu','np','nc'].forEach(i=>$(i).value='');toast('یوزر شامل ہو گیا');
}
let EID;
const canE=e=>e.id&&(D.me.role=='admin'||(D.me.role=='teacher'&&D.me.class==e.class));
function editE(id){
  const e=D.entries.find(x=>x.id==id);if(!e)return;EID=id;const v=V(e);
  $('e_h').textContent=e.name+' — '+e.class;$('e_m').value=mon(e);$('e_n').value=e.note||'';
  $('e_f').innerHTML=fk(cfg(e.class)).map(k=>`<label class="f">${esc(L(k))}<input id="e_${k}" type="number" step="any" value="${v[k]??''}"></label>`).join('');
  $('md').hidden=false;
}
async function saveE(){
  const vals={};D.keys.forEach(k=>{const el=$('e_'+k);if(el&&el.value!=='')vals[k]=+el.value;});
  const r=await call({action:'editEntry',id:EID,date:$('e_m').value,vals,note:$('e_n').value});
  if(!r.ok)return toast(r.msg,1);D=r;$('md').hidden=true;fill();toast('اندراج درست ہو گئی');
}
async function delE(id){
  if(!confirm('کیا آپ واقعی یہ اندراج حذف کرنا چاہتے ہیں؟'))return;
  const r=await call({action:'delEntry',id});
  if(!r.ok)return toast(r.msg,1);D=r;fill();toast('اندراج حذف ہو گئی');
}
function render(){
  CH.forEach(c=>c.destroy());CH=[];
  Chart.defaults.font.family="'Noto Naskh Arabic',serif";Chart.defaults.color='#5d6e6b';
  const c=$('cf').value,m=$('mf').value,sv=$('sf').value;
  const E=D.entries.filter(e=>(!c||e.class==c)&&(!m||mon(e)==m)&&(!sv||e.username==sv));
  const bs=sv?D.students.find(x=>x.username==sv):(D.me.role=='student'?D.students[0]:null);
  $('mine').hidden=!bs;
  if(bs)$('mine').innerHTML=ava(bs.username,bs.name,'xl')+`<div><b>${esc(bs.name)}</b><div class="note">${esc(bs.class)}${D.photos[bs.username]?'':(D.me.role=='student'?' — «کارکردگی درج کریں» میں اپنی تصویر لگائیں':'')}</div></div>`;
  const by={};
  E.forEach(e=>{const s=((by[e.class]??={})[e.username]??={u:e.username,name:e.name,n:0,sum:{},cnt:{}});
    s.n++;const v=V(e);for(const k in v){s.sum[k]=(s.sum[k]||0)+v[k];s.cnt[k]=(s.cnt[k]||0)+1;}});
  let h='';const items=[];
  Object.keys(by).forEach((k,i)=>{
    const f=cfg(k),ks=fk(f),A=Object.values(by[k]);
    const ms=m?[m]:[...new Set(E.filter(e=>e.class==k).map(mon))];
    const T={};TK.forEach(x=>{T[x]=tgt(k,x,ms)});
    const val=(s,key)=>key=='test'?(s.sum[key]||0)/(s.cnt[key]||1):(s.sum[key]||0);
    items.push({i,A,ks,T,val});
    const chips=TK.filter(x=>ks.includes(x)&&T[x]).map(x=>`<span class="chip">اوسط ${esc(L(x))} ${Math.round(A.reduce((a,s)=>a+val(s,x)/T[x]*100,0)/A.length)}%</span>`).join('');
    h+=`<div class="cls"><div class="clsh"><h3>${esc(k)}</h3><span class="chip">طلبہ ${A.length}</span>${chips}</div><div class="t"><table><tr><th>نام</th><th>اندراجات</th>`+
      ks.map(x=>`<th>${esc(L(x))}${T[x]?`<small class="tg">ہدف ${T[x]}</small>`:''}</th>`).join('')+'</tr>'+
      A.map(s=>`<tr><td><div class="nm">${ava(s.u,s.name)}${esc(s.name)}</div></td><td>${s.n}</td>`+
        ks.map(x=>{const v=val(s,x),n=+v.toFixed(1);
          if(!T[x])return `<td><span class="num">${n}</span></td>`;
          const p=Math.round(v/T[x]*100),l=lv(p);
          return `<td><span class="num">${n}</span><span class="pc ${l}">${p}%</span><div class="bar"><i class="${l}" style="width:${Math.min(p,100)}%"></i></div></td>`}).join('')+'</tr>').join('')+
      `</table></div>${TK.some(x=>ks.includes(x)&&!T[x])?'<p class="note">جن خانوں کا ہدف مقرر نہیں، ان کا فیصد نہیں آئے گا۔ «ماہانہ ہدف» میں ہدف لکھیں۔</p>':''}<div class="cw"><canvas id="ch${i}"></canvas></div></div>`;
  });
  $('out').innerHTML=h||'<div class="empty">اس انتخاب کا کوئی ریکارڈ نہیں۔ «کارکردگی درج کریں» میں پہلی اندراج کریں۔</div>';
  items.forEach(({i,A,ks,T,val})=>{
    CH.push(new Chart($('ch'+i),{type:'bar',data:{labels:A.map(s=>s.name),
      datasets:ks.map((x,j)=>({label:L(x)+(T[x]?' %':''),backgroundColor:COL[j%COL.length],borderRadius:4,
        data:A.map(s=>T[x]?Math.round(val(s,x)/T[x]*100):+val(s,x).toFixed(1))}))},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true,grid:{color:'#e6ecea'}},x:{grid:{display:false}}}}}));
  });
  $('log').innerHTML='<tr><th>ماہ</th><th>نام</th><th>جماعت</th><th>تفصیل</th><th>نوٹ</th><th></th></tr>'+
    E.slice(-60).reverse().map(e=>`<tr><td>${esc(mon(e))}</td><td>${esc(e.name)}</td><td>${esc(e.class)}</td><td style="text-align:right">${
      Object.entries(V(e)).map(([k,v])=>`${esc(L(k)||k)}: <b>${v}</b>`).join('، ')}</td><td>${esc(e.note)}</td><td style="white-space:nowrap">${canE(e)?`<button class="ib" title="تبدیل کریں" onclick="editE('${esc(e.id)}')">✏️</button><button class="ib" title="حذف کریں" onclick="delE('${esc(e.id)}')">🗑️</button>`:''}</td></tr>`).join('');
}
</script>
</body></html>
