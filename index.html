<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Performance Portal</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@500;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
@font-face{font-family:'JNN';src:local('Jameel Noori Nastaleeq'),local('JameelNooriNastaleeq'),local('Jameel Noori Nastaleeq Kasheeda'),url('JameelNooriNastaleeq.ttf') format('truetype');font-display:swap}
:root{
  --ink:#0f172a; --mute:#64748b; --line:#e2e8f0; --paper:#f8fafc; --card:#ffffff;
  --pri:#0f766e; --pri2:#115e59; --tint:#f0fdfa; 
  --ok:#10b981; --mid:#f59e0b; --low:#ef4444;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --radius-md:12px; --radius-lg:18px;
  --serif:'Fraunces','Noto Naskh Arabic',serif; --sans:'Source Sans 3','Noto Naskh Arabic',sans-serif
}
html[lang=ur]{--serif:'JNN','Noto Nastaliq Urdu','Noto Naskh Arabic',serif;--sans:'JNN','Noto Nastaliq Urdu','Noto Naskh Arabic',serif}
html[lang=ur] h1,html[lang=ur] h2,html[lang=ur] h3,html[lang=ur] h4,html[lang=ur] .ttl,html[lang=ur] .me b{font-weight:400}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
html[lang=ur] body{line-height:2.1}
h1,h2,h3,.ttl{font-family:var(--serif);font-weight:700;line-height:1.3;margin:0;color:var(--pri)}
html[lang=ur] h1,html[lang=ur] h2,html[lang=ur] h3,html[lang=ur] .ttl{line-height:2.1}
button,input,select{font:inherit;color:inherit;outline:none}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
[hidden]{display:none!important}
td,option,.nm,.me b{unicode-bidi:plaintext}

/* Header */
.top{background:var(--card);border-bottom:1px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:44px;height:44px;border-radius:10px;background:var(--tint);color:var(--pri);display:grid;place-items:center;font:700 18px var(--serif);overflow:hidden;border:1px solid #ccfbf1}
.mark img{width:100%;height:100%;object-fit:contain;padding:4px}
.brand small{opacity:.7;display:block;line-height:1.3;font-weight:500;color:var(--mute)}
.ttl{font-size:20px}
.tr{display:flex;align-items:center;gap:12px;font-size:14px}
.user{display:flex;align-items:center;gap:12px;font-weight:600}

/* Buttons */
.btn{background:var(--pri);color:#fff;border:0;border-radius:var(--radius-md);padding:8px 20px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;box-shadow:var(--shadow-sm)}
.btn:hover{background:var(--pri2);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--tint);border-color:var(--pri)}
.btn.sm{padding:6px 14px;font-size:13px;border-radius:8px}
.btn.danger{background:var(--low);color:#fff}
.btn.danger:hover{background:#dc2626}
.top .btn,.lang{background:transparent;color:var(--mute);border:1px solid transparent;box-shadow:none}
.top .btn:hover,.lang:hover{background:var(--paper);color:var(--ink);transform:none}
.lang{border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;transition:all .2s}

/* Layout & Panels */
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);margin-bottom:24px}
.panel>h2{font-size:22px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:end;margin-top:16px}

/* Login Screen */
.login{max-width:860px;margin:60px auto;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:24px;overflow:hidden;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.login .side{background:var(--pri);color:#fff;padding:48px 40px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.login .side::after{content:'';position:absolute;top:-50%;right:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,0.1) 0%,transparent 60%);pointer-events:none}
.lg{width:140px;height:140px;object-fit:contain;background:#fff;border-radius:20px;padding:12px;margin-bottom:24px;align-self:flex-start;box-shadow:var(--shadow-sm)}
.login .side h1{font-size:28px;color:#fff}.login .side p{opacity:.8;margin:12px 0 0;font-size:16px;line-height:1.5}
.login form{padding:48px 40px;display:flex;flex-direction:column;gap:16px}
.err{color:var(--low);min-height:1.5em;font-weight:600;font-size:14px}

/* Forms */
label.f{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:6px;font-weight:600}
label.f input,label.f select,.bar-tools select,.bar-tools input{border:1px solid var(--line);background:var(--paper);border-radius:var(--radius-md);padding:10px 14px;font-size:15px;color:var(--ink);width:100%;font-weight:500;transition:all .2s}
label.f input:focus,label.f select:focus,.bar-tools select:focus,.bar-tools input:focus{background:#fff;border-color:var(--pri);box-shadow:0 0 0 3px var(--tint)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}

/* Tabs */
.tabs{display:flex;gap:8px;margin:16px 0 24px;overflow-x:auto;padding-bottom:4px;border-bottom:2px solid var(--line)}
.tabs button{background:none;border:0;padding:10px 20px;cursor:pointer;color:var(--mute);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-6px;white-space:nowrap;transition:all .2s;border-radius:8px 8px 0 0}
.tabs button:hover{color:var(--pri);background:var(--paper)}
.tabs button.on{color:var(--pri);border-color:var(--pri);background:var(--tint)}

/* Tools Bar */
.bar-tools{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:24px;padding:16px;background:var(--paper);border-radius:var(--radius-md);border:1px solid var(--line)}
.bar-tools label{display:flex;align-items:center;gap:8px;color:var(--mute);font-weight:600;font-size:14px}
.bar-tools select{width:auto;min-width:140px;padding:8px 12px;background:#fff}
.bar-tools input{padding:8px 12px;background:#fff}
.bar-tools .sp{flex:1}

/* Profile Banner */
.me{display:flex;align-items:center;gap:20px;background:linear-gradient(to right,var(--tint),#fff);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:24px;border:1px solid #ccfbf1;box-shadow:var(--shadow-sm)}
.me b{font:700 22px var(--serif);color:var(--pri)}
.ava{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;box-shadow:var(--shadow-sm)}
.ava.xl{width:80px;height:80px;font-size:32px;border:3px solid #fff}
.ini{display:inline-grid;place-items:center;background:var(--tint);color:var(--pri);font-weight:700;border:1px solid #ccfbf1}
.nm{display:flex;align-items:center;gap:12px;font-weight:600}
.nm.click{cursor:pointer}
.nm.click:hover .nmt{text-decoration:underline;color:var(--pri)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px}
.kpi{border:1px solid var(--line);border-radius:var(--radius-md);padding:16px 20px;background:#fff;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:transform .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.kpi::before{content:'';position:absolute;top:0;left:0;width:100%;height:4px;background:var(--pri)}
.kpi.ok::before{background:var(--ok)}.kpi.mid::before{background:var(--mid)}.kpi.low::before{background:var(--low)}
.kpi small{display:block;color:var(--mute);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.kpi b{display:block;font:700 32px/1.2 var(--serif);color:var(--ink);margin-top:8px}

/* Tables */
.t{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);background:#fff}
table{border-collapse:collapse;width:100%;min-width:650px}
th{background:var(--paper);color:var(--mute);font-size:13px;padding:14px 12px;text-align:center;position:sticky;top:0;white-space:nowrap;font-weight:700;border-bottom:2px solid var(--line)}
td{padding:14px 12px;border-top:1px solid var(--line);text-align:center;vertical-align:middle;font-size:14px;transition:background .15s}
td:first-child,th:first-child,td.l,th.l{text-align:start}
tbody tr:hover td{background:var(--tint)}
small.tg{display:block;font-weight:500;color:var(--mute);margin-top:2px}
.rk{color:var(--mute);font-weight:700;width:40px}

/* Cells & Bars */
.num{font-weight:700;font-size:16px;color:var(--ink)}
.of{color:var(--mute);font-size:12px;font-weight:500}
.pc{font-size:13px;font-weight:700;display:inline-block;margin-top:4px}
.pc.ok{color:var(--ok)}.pc.mid{color:#b45309}.pc.low{color:var(--low)}
.bar{height:6px;background:var(--line);border-radius:4px;margin:6px auto 0;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .5s ease-out}
.bar i.ok{background:var(--ok)}.bar i.mid{background:var(--mid)}.bar i.low{background:var(--low)}

/* Badges */
.bd{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:4px 10px;white-space:nowrap}
.bd.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.bd.mid{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
.bd.low{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}

/* Cards (Scorecards/Charts) */
.cbox{border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;background:#fff;box-shadow:var(--shadow-sm)}
.cbox h5{margin:0 0 16px;font:700 16px var(--sans);color:var(--ink)}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:20px;margin-top:20px}

.scs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.sc{border:1px solid var(--line);border-radius:var(--radius-md);padding:16px 20px;background:#fff;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.sc.ok::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ok)}
.sc.mid::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mid)}
.sc.low::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--low)}
.sc small{color:var(--mute);font-weight:600;font-size:13px}
.sc b{font:700 28px/1.3 var(--serif);color:var(--ink)}
.sc.big{background:var(--pri);border-color:var(--pri);color:#fff}
.sc.big small{color:#ccfbf1}.sc.big b{font-size:36px;color:#fff}
.sc.big.ok,.sc.big.mid,.sc.big.low{background:var(--pri);border:1px solid var(--pri)}
.sc.big::after{display:none}
.scf{display:flex;justify-content:space-between;align-items:center;margin-top:8px}

/* Modals */
.md{position:fixed;inset:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:1000;padding:16px;animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.mb{background:var(--card);border-radius:var(--radius-lg);padding:24px;max-width:600px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg);animation:slideUp .3s ease-out}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.pmx{position:absolute;top:12px;inset-inline-end:16px;font-size:24px;color:var(--mute);background:var(--paper);border:1px solid var(--line);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.pmx:hover{background:#fecaca;color:var(--low);border-color:#fca5a5}

/* Attendance */
.attcard{border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;margin-bottom:24px;background:#fff;box-shadow:var(--shadow-sm)}
.attcard h3{font-size:20px;color:var(--pri)}
.atk{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:16px 0 8px}
.at-t{border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 16px;background:var(--paper);border-left:4px solid var(--pri)}
.at-t.ok{border-left-color:var(--ok)}.at-t.mid{border-left-color:var(--mid)}.at-t.low{border-left-color:var(--low)}
.at-t small{display:block;color:var(--mute);font-weight:600;font-size:12px}.at-t b{font:700 24px/1.2 var(--serif);color:var(--ink)}
.nmchip{display:inline-flex;align-items:center;border-radius:8px;padding:4px 12px;font-weight:600;cursor:pointer;unicode-bidi:plaintext;border:1px solid var(--line);transition:all .15s}
.nmchip:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.nmchip.a{background:#fef2f2;color:var(--low);border-color:#fecaca}
.nmchip.l{background:#fffbeb;color:var(--mid);border-color:#fde68a}

/* Calendar */
.cal{border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;background:#fff;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:16px}
.cgrid .w{text-align:center;color:var(--mute);font-size:13px;font-weight:700}
.cgrid .d{min-height:44px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:600;background:var(--paper);color:var(--mute)}
.cgrid .d.e{border:0;background:transparent}
.cgrid .d.p{background:var(--ok);border-color:var(--ok);color:#fff}.cgrid .d.l{background:var(--mid);border-color:var(--mid);color:#fff}.cgrid .d.a{background:var(--low);border-color:var(--low);color:#fff}

/* Inputs & Toggles */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:8px 16px;font-weight:600;color:var(--mute);cursor:pointer;border-inline-start:1px solid var(--line);transition:all .2s}
.seg button:first-child{border-inline-start:0}.seg button:hover{background:var(--paper)}
.seg button.on.p{background:var(--ok);color:#fff}.seg button.on.l{background:var(--mid);color:#fff}.seg button.on.a{background:var(--low);color:#fff}

.plist{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:16px}
.pr{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 16px;background:#fff;transition:all .2s;box-shadow:var(--shadow-sm)}
.pr:hover{border-color:#cbd5e1}
.pr.off{background:var(--paper);opacity:.6;box-shadow:none}
.pr .lb{flex:1;display:flex;align-items:center;gap:12px;font-weight:600;cursor:pointer}
.pr input.tin{width:100px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.pr input.tin:focus{background:#fff;border-color:var(--pri)}

/* Misc */
.hint{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:20px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:var(--radius-md);padding:16px;font-weight:500}
.note{color:var(--mute);font-size:14px;margin:8px 0 0;line-height:1.5}
.empty{text-align:center;color:var(--mute);padding:48px 20px;font-weight:500}
#toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 24px;border-radius:var(--radius-md);z-index:2000;font-weight:600;box-shadow:var(--shadow-lg);animation:slideUp .3s ease-out}
#toast.bad{background:var(--low)}

/* Responsive */
@media(max-width:768px){
  .login{grid-template-columns:1fr;margin:24px 16px}
  .login .side{padding:32px 24px}
  .login form{padding:32px 24px}
  .top{padding:12px 16px}
  .panel{padding:16px}
  .bar-tools{flex-direction:column;align-items:stretch}
  .bar-tools select,.bar-tools input{width:100%}
  .bar-tools .sp{display:none}
  .ttl{font-size:16px}
  .kpi b{font-size:24px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark"><img src="logo.png" alt="" onerror="this.replaceWith('SD')"></span><div><div class="ttl" data-i="title"></div><small data-i="sub"></small></div></div>
  <div class="tr">
    <span class="vtag" id="vtag" style="display:none"></span>
    <button class="lang" id="lgb" onclick="setLang(LG=='en'?'ur':'en')"></button>
    <div id="user" class="user" hidden><span id="who"></span><button class="btn ghost sm" onclick="location.reload()" data-i="logout"></button></div>
  </div>
</header>

<div id="login" class="login">
  <div class="side"><img class="lg" src="logo.png" alt="Jamia-tul-Madina" onerror="this.style.display='none'"><h1 data-i="side_h"></h1><p data-i="side_p"></p></div>
  <form onsubmit="login();return false">
    <h2 data-i="signin" style="font-size:24px;margin-bottom:8px;">Sign In</h2>
    <label class="f"><span data-i="user_l"></span><input id="u" autocomplete="username"></label>
    <label class="f"><span data-i="pass_l"></span><input id="p" type="password" autocomplete="current-password"></label>
    <div id="msg" class="err"></div>
    <button class="btn" type="submit" data-i="signin" style="margin-top:8px;padding:12px"></button>
  </form>
</div>

<div id="app" class="wrap" hidden>
  <nav class="tabs">
    <button data-t="an" class="on" onclick="show('an')" data-i="t_an"></button>
    <button data-t="en" onclick="show('en')" data-i="t_en"></button>
    <button data-t="at" id="tbA" onclick="show('at')" data-i="t_at"></button>
    <button data-t="tg" id="tbT" onclick="show('tg')" data-i="t_tg"></button>
    <button data-t="adm" id="tbU" onclick="show('adm')" data-i="t_us"></button>
  </nav>

  <section id="p_an" class="panel">
    <div id="mine" class="me" hidden></div>
    <div class="bar-tools">
      <label><span data-i="month"></span><select id="mf" onchange="render()"></select></label>
      <label><span data-i="cls"></span><select id="cf" onchange="fsf();render()"></select></label>
      <label><span data-i="stu"></span><select id="sf" onchange="render()"></select></label>
      <label><span data-i="sr_l"></span><select id="sr" onchange="srOpen(this)"></select></label>
      <span class="sp"></span>
      <button class="btn ghost sm" onclick="window.print()" data-i="print"></button>
      <button class="btn ghost sm" onclick="exportCSV()" data-i="export"></button>
    </div>
    <div id="attcard"></div>
    <div id="mycal"></div>
    <div id="out"></div>
    <h4 data-i="recent"></h4>
    <div class="t"><table id="log"></table></div>
  </section>

  <section id="p_en" class="panel" hidden>
    <h2 data-i="e_h"></h2>
    <div class="grid" style="margin-top:16px">
      <label class="f"><span data-i="stu"></span><select id="st" onchange="fields()"></select></label>
      <label class="f"><span data-i="month"></span><input id="dt" type="month" onchange="fields()"></label>
    </div>
    <div id="flds" class="grid" style="margin-top:16px"></div>
    <div id="svto" class="note" style="margin-top:12px"></div>
    <div id="autoat" class="note" style="margin-top:8px"></div>
    <div id="lockmsg" class="hint" hidden></div>
    <div class="row">
      <label class="f" style="flex:1;min-width:200px"><span data-i="note"></span><input id="no"></label>
      <button class="btn" id="savebtn" onclick="add()" data-i="save"></button>
      <span id="fillcnt" class="note" style="align-self:center"></span>
    </div>
    <div id="ph" class="row" style="border-top:1px solid var(--line);margin-top:24px;padding-top:24px;align-items:center">
      <span id="pv"></span>
      <label class="btn ghost"><span data-i="add_photo"></span><input type="file" accept="image/*" hidden onchange="pick(this)"></label>
    </div>
  </section>

  <section id="p_at" class="panel" hidden>
    <h2 data-i="at_h"></h2>
    <p class="note" data-i="at_note"></p>
    <div class="atbar">
      <label class="f"><span data-i="cls"></span><select id="ac" onchange="loadAtt()"></select></label>

  g.save();g.strokeStyle='#14201f66';g.setLineDash([5,4]);g.beginPath();if(axis=='x'){g.moveTo(px,a.top);g.lineTo(px,a.bottom);}else{g.moveTo(a.left,px);g.lineTo(a.right,px);}g.stroke();g.restore();}});
const ovBadge=s=>s.ov==null?`<span class="bd mid">${t('no_nums')}</span>`:`<span class="bd ${lv(s.ov)}">${stl(lv(s.ov))}</span>`;
function scorecard(s,ks,Tg,at){
  const l=s.ov==null?'':lv(s.ov);
  const ac=at&&at.t?`<div class="sc ${lv(at.pc)}"><small>${t('at_rec')}</small><b>${at.pc}%</b><div class="bar"><i class="${lv(at.pc)}" style="width:${Math.min(at.pc,100)}%"></i></div><div class="scf"><span class="note" style="margin:0">${attTxt(at)}</span></div></div>`:'';
  return `<div class="scs"><div class="sc big ${l}"><small>${t('overall')}</small><b>${s.ov==null?'—':s.ov+'%'}</b>${ovBadge(s)}</div>`+ks.map(x=>{
    const lb=`<small>${esc(L(x))}</small>`;
    if(s.none)return `<div class="sc">${lb}<b>—</b></div>`;
    const v=vl(s,x),n=+v.toFixed(1);
    if(!Tg[x])return `<div class="sc">${lb}<b>${n}</b><span class="of">${t('sc_nt')}</span></div>`;
    const p=Math.round(v/Tg[x]*100),q=lv(p);
    return `<div class="sc ${q}">${lb}<b><bdi dir="ltr">${n}<span class="of"> / ${+Tg[x].toFixed(1)}</span></bdi></b><div class="bar"><i class="${q}" style="width:${Math.min(p,100)}%"></i></div><div class="scf"><span class="pc ${q}">${p}%</span><span class="bd ${q}">${stl(q)}</span></div></div>`;
  }).join('')+ac+'</div>';
}
function ptable(A,ks,Tg,tf,m){
  const hasAt=A.some(s=>attOf(s.u,m).t>0);
  const cell=(s,x)=>{
    if(s.none)return `<td><span class="of">—</span></td>`;
    const v=vl(s,x),n=+v.toFixed(1);
    if(!Tg[x])return `<td><span class="num">${n}</span></td>`;
    const p=Math.round(v/Tg[x]*100),q=lv(p);
    return `<td><div class="c2"><div dir="ltr"><span class="num">${n}</span><span class="of"> / ${+Tg[x].toFixed(1)}</span></div><div class="bar"><i class="${q}" style="width:${Math.min(p,100)}%"></i></div><span class="pc ${q}">${p}%</span></div></td>`;
  };
  const atc=s=>{const o=attOf(s.u,m);return o.t?`<td><div class="c2"><b class="pc ${lv(o.pc)}">${o.pc}%</b><small class="of" style="white-space:nowrap">${attTxt(o)}</small></div></td>`:`<td><span class="of">—</span></td>`;};
  return `<div class="t"><table><thead><tr><th class="rk">#</th><th class="l">${t('name')}</th><th>${t('entries')}</th>`+
    ks.map(x=>`<th>${esc(L(x))}${Tg[x]?`<small class="tg">${t('target')} ${+Tg[x].toFixed(1)}</small>`:''}</th>`).join('')+(hasAt?`<th>${t('at_rec')}</th>`:'')+(tf.length?`<th>${t('overall')}</th>`:'')+'</tr></thead><tbody>'+
    A.map((s,j)=>`<tr><td class="rk">${j+1}</td><td class="l"><div class="nm click" data-u="${esc(s.u)}" onclick="openProfile(this.dataset.u)">${ava(s.u,s.name)}<span class="nmt">${esc(s.name)}</span></div></td><td>${s.n}</td>`+ks.map(x=>cell(s,x)).join('')+(hasAt?atc(s):'')+
      (tf.length?(s.ov==null?`<td>${ovBadge(s)}</td>`:`<td><div class="ov"><b class="pc ${lv(s.ov)}">${s.ov}%</b>${ovBadge(s)}</div></td>`):'')+'</tr>').join('')+'</tbody></table></div>';
}
let PU=null;
function openPhoto(u){
  const s=D.students.find(x=>String(x.username)==String(u));
  if(!D.photos[u])return toast(t('pf_nophoto'),1);

function openProfile(u,per){
  const s=D.students.find(x=>String(x.username)==String(u));if(!s)return;PU=s.username;PP=per===undefined?'':per;
  const m=PP,all=D.entries.filter(e=>String(e.username)==String(u)),list=all.filter(e=>!m||mon(e)==m);

    const det=ordk(new Set(Object.keys(a2.sum))).map(k=>`${esc(L(k))}: <b>${+vl(a2,k).toFixed(1)}</b>`).join(LG=='ur'?'، ':', ');

  const months=[...new Set([...all.map(mon),...(D.attsum||[]).filter(r=>String(r.username)==String(u)).map(r=>r.month)])].sort().reverse();
  const photo=D.photos[s.username],calM=m||lastAttMonth(s.username)||(hs.length?hs[hs.length-1].mm:todayStr().slice(0,7));
  const trend=hs.filter(x=>x.o2!=null);
  $('pm_in').innerHTML=`<div class="pmh"><span class="${photo?'pz':''}" ${photo?`onclick="openPhoto(PU)"`:''}>${ava(s.username,s.name,'xxl')}</span>`+
    `<div><h2>${esc(s.name)}</h2><div class="note" style="unicode-bidi:plaintext">${esc(s.class)} · ${esc(s.username)}</div>${photo?'':`<div class="note">${t('pf_nophoto')}</div>`}</div></div>`+
    `<div class="row" style="margin-bottom:6px"><label class="btn ghost sm">${t('chg_photo')}<input type="file" accept="image/*" hidden onchange="pick(this,PU)"></label>`+
    `<button class="btn sm" onclick="goStudent()">${t('pf_open')}</button>`+
    `<label class="f" style="flex-direction:row;align-items:center;gap:8px;margin-left:auto"><span>${t('pf_pick')}</span><select class="pps" onchange="openProfile(PU,this.value)"><option value="">${t('pf_overall')}</option>${months.map(x=>`<option ${x==m?'selected':''}>${x}</option>`).join('')}</select></label></div>`+
    `<h4>${t('pf_period')} — ${esc(m||t('pf_overall'))}</h4>`+(list.length?scorecard(a,ks,Tg,attOf(s.username,m)):`<div class="empty">${t('empty')}</div>`)+
    (trend.length>1?`<div class="cbox" style="margin-top:16px"><h5>${t('ch_trend')}</h5><div style="height:210px"><canvas id="pch"></canvas></div></div>`:'')+
    `<div id="pcal" style="margin-top:16px"></div>`+
    (hist?`<h4>${t('pf_hist')}</h4><div class="t"><table><thead><tr><th class="l">${t('month')}</th><th>${t('overall')}</th><th></th><th class="l">${t('details')}</th><th class="l">${t('at_rec')}</th></tr></thead><tbody>${hist}</tbody></table></div>`:'');
  $('pm').hidden=false;

  if(trend.length>1&&typeof Chart!='undefined'){
    PCH=new Chart($('pch'),{type:'line',data:{labels:trend.map(x=>x.mm),datasets:[{data:trend.map(x=>x.o2),borderColor:'#0f766e',backgroundColor:'#ccfbf1',fill:true,tension:.3,pointRadius:5,pointBackgroundColor:'#0f766e'}]},
      options:{rtl:LG=='ur',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,suggestedMax:100,grid:{color:'#e2e8f0'},ticks:{callback:v=>v+'%'}},x:{grid:{display:false}}}},plugins:[hl('y')]});
  }
  drawCal('pcal',s.username,calM);
}
function goStudent(){
  const s=D.students.find(x=>String(x.username)==String(PU));if(!s)return;
  $('pm').hidden=true;$('cf').value=s.class;fsf();$('sf').value=s.username;render();show('an');window.scrollTo({top:0,behavior:'smooth'});

function render(){
  CH.forEach(c=>c.destroy());CH=[];srFill();
  Chart.defaults.font.family=LG=='ur'?UF:EF;Chart.defaults.color='#64748b';
  const c=$('cf').value,m=$('mf').value,sv=$('sf').value;

    const st=new Set();ms.forEach(x=>fset(k,x).forEach(y=>st.add(y)));
    E.filter(e=>e.class==k).forEach(e=>Object.keys(V(e)).forEach(y=>st.add(y)));

    if(A.length>1&&tf.length)cg+=`<div class="cbox"><h5>${t('ch_perf')}</h5><div style="height:${Math.max(200,70+tf.length*34)}px"><canvas id="cp${i}"></canvas></div></div>`;
    const bm=[...new Set(base.filter(e=>e.class==k).map(mon))].sort();

      const o=Object.entries(per).map(([u,l])=>{const a=agg(l);withAtt(a,[mm],u,l);return ovOf(a,k,[mm]);}).filter(x=>x!=null);return o.length?Math.round(o.reduce((a,b)=>a+b,0)/o.length):null;});
    if(tr.filter(x=>x!=null).length>1)cg+=`<div class="cbox"><h5>${t('ch_trend')}</h5><div style="height:240px"><canvas id="ct${i}"></canvas></div></div>`;

    const o2=$('cp'+i);

    E.slice(-60).reverse().map(e=>`<tr><td class="l" style="white-space:nowrap">${esc(mon(e))}</td><td class="l">${esc(e.name)}</td><td class="l">${esc(e.class)}</td><td class="l">${
