:root{
  --ink:#0f172a; --mute:#64748b; --line:#e2e8f0; --paper:#f8fafc; --card:#ffffff;

  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);

html[lang=ur]{--serif:'JNN','Noto Nastaliq Urdu','Noto Naskh Arabic',serif;--sans:'JNN','Noto Nastaliq Urdu','Noto Naskh Arabic',serif}

*{box-sizing:border-box}
